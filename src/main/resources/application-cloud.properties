# Cloud Profile for 24/7 Render Deployment (No laptop needed, completely independent)
server.port=${PORT:8080}
server.servlet.context-path=/

# Self-contained persistent database stored inside Render container
spring.datasource.url=${DB_URL:jdbc:h2:file:/app/data/grocery_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway disabled for embedded cloud mode; DataInitializer seeds users and grocery items
spring.flyway.enabled=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.grocery.assistant=INFO
logging.level.org.springframework.web=INFO
