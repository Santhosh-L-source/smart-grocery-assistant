spring.application.name=smart-grocery-assistant

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration (Zero-setup Self-Contained Database)
spring.datasource.url=jdbc:h2:file:./data/grocery_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations disabled for embedded database
spring.flyway.enabled=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.grocery.assistant=INFO
logging.level.org.springframework.web=INFO
