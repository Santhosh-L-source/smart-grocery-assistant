spring.application.name=smart-grocery-assistant

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration (Defaults to embedded database on cloud unless DB_URL is explicitly set)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/grocery_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations (enabled for MySQL, skipped for embedded fallback)
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.grocery.assistant=INFO
logging.level.org.springframework.web=INFO
