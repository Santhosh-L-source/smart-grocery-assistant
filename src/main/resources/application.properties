spring.application.name=smart-grocery-assistant

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration (Uses your local MySQL on PC; falls back to embedded on Render)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/grocery_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:@15095780sa}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.grocery.assistant=INFO
logging.level.org.springframework.web=INFO
