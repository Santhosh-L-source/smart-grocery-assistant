spring.application.name=smart-grocery-assistant-test

# In-Memory H2 Database for Tests
spring.datasource.url=jdbc:h2:mem:grocery_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway disabled in test slice since schema is created by hibernate
spring.flyway.enabled=false

# Disable security logging noise in tests
logging.level.org.springframework.security=WARN
